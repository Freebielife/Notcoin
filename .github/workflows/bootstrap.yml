name: Bootstrap Notcoin Observatory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
concurrency:
  group: notcoin-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out Notcoin
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 5
      - name: Check out public Observatory factory
        uses: actions/checkout@v4
        with:
          repository: Freebielife/Ludoman
          path: .observatory-factory
          persist-credentials: false
      - name: Prepare build dependency
        run: python3 -m pip install Pillow
      - name: Generate isolated Notcoin site
        run: |
          set -euo pipefail
          (cd .observatory-factory && python3 -m scripts.scaffold_observatory --config "$GITHUB_WORKSPACE/project.json" --output "$RUNNER_TEMP/notcoin-generated")
          cp -a "$RUNNER_TEMP/notcoin-generated/." .
          rm -rf .observatory-factory
          test -f .github/workflows/update.yml
          test -f web/page.html
      - name: Validate implementation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p "test_*.py"
          node --check web/app.js
          node --test tests/*.test.cjs
          python3 build.py
          python3 verify.py
      - name: First on-chain collection
        id: collect
        continue-on-error: true
        timeout-minutes: 18
        run: python3 -m scripts.refresh_observatory
      - name: Publish initial verified snapshot and web page
        run: |
          set -euo pipefail
          python3 build.py
          python3 verify.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Generate Notcoin observatory from shared factory"
            git push origin HEAD:main
          fi
      - name: Warn on incomplete data
        if: steps.collect.outcome == 'failure'
        run: echo "::warning::Initial collection failed; snapshot may be incomplete. Future update runs will retry."
